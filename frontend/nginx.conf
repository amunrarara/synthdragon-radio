server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # Serve the frontend index.html for the root route
    location = / {
        try_files /frontend/index.html =404;
    }

    # Serve CSS and JS files from frontend directory (for relative paths in index.html)
    location ~ \.(css|js)$ {
        try_files /frontend$uri $uri =404;
    }

    # Proxy Icecast stream - disable buffering for live streaming
    location /stream {
        proxy_pass http://icecast:8000/stream;
        proxy_buffering off;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 86400;
    }

    # Proxy Icecast metadata endpoint
    location /status-json.xsl {
        proxy_pass http://icecast:8000/status-json.xsl;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # Serve all other static files
    location / {
        try_files $uri $uri/ =404;
    }

    # Enable gzip compression
    gzip on;
    gzip_types text/plain text/css application/javascript application/json;
}
